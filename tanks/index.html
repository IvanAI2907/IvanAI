<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Танчики</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d29;
    --border: #2e3346;
    --accent: #7c5cff;
    --text: #e8e9f0;
    --muted: #8a8fa3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1c1f2e, #0b0c12);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    padding: 16px;
  }
  .app {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  canvas#board {
    display: block;
    background: #000;
    border-radius: 6px;
  }
  .side {
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .stat-row b { color: var(--accent); }
  .keys {
    font-size: 13px;
    line-height: 1.7;
    color: var(--muted);
  }
  .keys b { color: var(--text); }
  button {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: #232739;
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { border-color: var(--accent); }
  .overlay {
    position: absolute;
    inset: 10px;
    background: rgba(5,6,10,0.86);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border-radius: 6px;
    text-align: center;
    padding: 20px;
  }
  .overlay h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: 0.05em;
  }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; max-width: 320px; }
  .overlay button { width: 180px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap">
    <canvas id="board" width="520" height="520"></canvas>
    <div id="overlay" class="overlay">
      <h1>ТАНЧИКИ</h1>
      <p>Уничтожь все вражеские танки и защити свою базу (орла). Кирпичные стены можно разрушить, стальные — нет.</p>
      <button id="startBtn">Начать игру (Enter)</button>
    </div>
  </div>
  <div class="side">
    <div class="panel">
      <h2>Статус</h2>
      <div class="stat-row"><span>Счёт</span><b id="scoreVal">0</b></div>
      <div class="stat-row"><span>Уровень</span><b id="levelVal">1</b></div>
      <div class="stat-row"><span>Жизни</span><b id="livesVal">3</b></div>
      <div class="stat-row"><span>Врагов осталось</span><b id="enemiesVal">20</b></div>
      <button id="pauseBtn">Пауза</button>
      <button id="restartBtn">Заново</button>
    </div>
    <div class="panel">
      <h2>Управление</h2>
      <div class="keys">
        <b>Стрелки / WASD</b> — движение<br>
        <b>Пробел / Enter</b> — выстрел<br>
        <b>P</b> — пауза
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const CELL = 20;
  const GRID = 26;
  const BOARD = CELL * GRID;
  const TANK = CELL * 2;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const scoreVal = document.getElementById('scoreVal');
  const levelVal = document.getElementById('levelVal');
  const livesVal = document.getElementById('livesVal');
  const enemiesVal = document.getElementById('enemiesVal');

  const EMPTY = 0, BRICK = 1, STEEL = 2, GRASS = 3, WATER = 4, BASE = 5;

  // 13x13 block layout, each block = 2x2 cells. '.' empty 'B' brick 'S' steel 'G' grass 'W' water
  const LEVELS = [
`.B..S..G..B..
B.B..GG..B.B.
..B..GG..B...
BB.S..B..S.BB
....B..B.....
.G.......G...
..B.BBBBB.B..
.G.......G...
....B..B.....
BB.S..B..S.BB
..B..GG..B...
B.B..GG..B.B.
.BB.B.EB.B.BB`,
`B.S.B..B.S.B.
.B..GGGG..B..
S.B..GG..B.S.
..B.S..S.B...
BB..B..B..BB.
.G..B..B..G..
..BBB..BBB...
.G..B..B..G..
BB..B..B..BB.
..B.S..S.B...
S.B..GG..B.S.
.B..GGGG..B..
B.S.B.EB.S.BB`
  ];

  let grid = [];
  let base = { x: 0, y: 0, alive: true };
  let baseCell = { r: 0, c: 0 };

  function buildLevel(index) {
    const layout = LEVELS[index % LEVELS.length].split('\n').map(r => r.trim());
    grid = [];
    for (let r = 0; r < GRID; r++) grid.push(new Array(GRID).fill(EMPTY));
    for (let br = 0; br < 13; br++) {
      for (let bc = 0; bc < 13; bc++) {
        const ch = layout[br][bc];
        let type = EMPTY;
        if (ch === 'B') type = BRICK;
        else if (ch === 'S') type = STEEL;
        else if (ch === 'G') type = GRASS;
        else if (ch === 'W') type = WATER;
        else if (ch === 'E') type = BASE;
        const r0 = br * 2, c0 = bc * 2;
        for (let dr = 0; dr < 2; dr++) {
          for (let dc = 0; dc < 2; dc++) {
            grid[r0 + dr][c0 + dc] = type;
          }
        }
        if (type === BASE) { baseCell = { r: r0, c: c0 }; }
      }
    }
    base.alive = true;
  }

  function cellSolidForTank(r, c) {
    if (r < 0 || c < 0 || r >= GRID || c >= GRID) return true;
    const t = grid[r][c];
    return t === BRICK || t === STEEL || t === WATER || t === BASE;
  }

  function cellBlocksBullet(r, c) {
    if (r < 0 || c < 0 || r >= GRID || c >= GRID) return true;
    const t = grid[r][c];
    return t === BRICK || t === STEEL || t === BASE;
  }

  const DIRS = {
    up: { dx: 0, dy: -1 },
    down: { dx: 0, dy: 1 },
    left: { dx: -1, dy: 0 },
    right: { dx: 1, dy: 0 }
  };

  class Tank {
    constructor(x, y, dir, isPlayer) {
      this.x = x; this.y = y;
      this.dir = dir;
      this.isPlayer = isPlayer;
      this.speed = isPlayer ? 2.4 : 1.5;
      this.alive = true;
      this.cooldown = 0;
      this.hp = 1;
      this.color = isPlayer ? '#ffd166' : '#ef476f';
      this.moveTimer = 0;
      this.invuln = 0;
      this.score = 100;
      this.type = 'normal';
    }
    rect() { return { x: this.x, y: this.y, w: TANK, h: TANK }; }
    cellsUnder() {
      const cells = [];
      const c0 = Math.floor(this.x / CELL), c1 = Math.floor((this.x + TANK - 1) / CELL);
      const r0 = Math.floor(this.y / CELL), r1 = Math.floor((this.y + TANK - 1) / CELL);
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) cells.push({ r, c });
      return cells;
    }
    canMoveTo(nx, ny) {
      if (nx < 0 || ny < 0 || nx + TANK > BOARD || ny + TANK > BOARD) return false;
      const c0 = Math.floor(nx / CELL), c1 = Math.floor((nx + TANK - 1) / CELL);
      const r0 = Math.floor(ny / CELL), r1 = Math.floor((ny + TANK - 1) / CELL);
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          if (cellSolidForTank(r, c)) return false;
        }
      }
      for (const t of allTanks()) {
        if (t === this || !t.alive) continue;
        if (rectsOverlap(nx, ny, TANK, TANK, t.x, t.y, TANK, TANK)) return false;
      }
      return true;
    }
    move(dir) {
      this.dir = dir;
      const d = DIRS[dir];
      const nx = this.x + d.dx * this.speed;
      const ny = this.y + d.dy * this.speed;
      if (d.dx !== 0) {
        if (this.canMoveTo(nx, this.y)) this.x = nx;
      } else {
        if (this.canMoveTo(this.x, ny)) this.y = ny;
      }
    }
    shoot() {
      if (this.cooldown > 0 || !this.alive) return;
      const d = DIRS[this.dir];
      const bx = this.x + TANK / 2 - 3 + d.dx * (TANK / 2);
      const by = this.y + TANK / 2 - 3 + d.dy * (TANK / 2);
      bullets.push(new Bullet(bx, by, this.dir, this.isPlayer, this));
      this.cooldown = this.isPlayer ? 22 : 55;
    }
  }

  class Bullet {
    constructor(x, y, dir, isPlayer, owner) {
      this.x = x; this.y = y; this.dir = dir;
      this.isPlayer = isPlayer;
      this.owner = owner;
      this.speed = isPlayer ? 6 : 4;
      this.size = 6;
      this.alive = true;
    }
    update() {
      const d = DIRS[this.dir];
      this.x += d.dx * this.speed;
      this.y += d.dy * this.speed;
      if (this.x < 0 || this.y < 0 || this.x > BOARD || this.y > BOARD) { this.alive = false; return; }
      const cx = this.x + this.size / 2, cy = this.y + this.size / 2;
      const c = Math.floor(cx / CELL), r = Math.floor(cy / CELL);
      if (cellBlocksBullet(r, c)) {
        const t = grid[r][c];
        if (t === BRICK) { grid[r][c] = EMPTY; }
        else if (t === BASE) { base.alive = false; explodeBase(); }
        this.alive = false;
        spawnSpark(this.x, this.y);
        return;
      }
      for (const b of bullets) {
        if (b === this || !b.alive) continue;
        if (Math.abs(b.x - this.x) < 8 && Math.abs(b.y - this.y) < 8) {
          this.alive = false; b.alive = false;
        }
      }
      for (const t of allTanks()) {
        if (!t.alive) continue;
        if (t === this.owner) continue;
        if (t.isPlayer === this.isPlayer) continue;
        if (t.invuln > 0) continue;
        if (rectsOverlap(this.x, this.y, this.size, this.size, t.x, t.y, TANK, TANK)) {
          this.alive = false;
          hitTank(t);
        }
      }
    }
  }

  let sparks = [];
  function spawnSpark(x, y) { sparks.push({ x, y, life: 8 }); }

  let player, enemies = [], bullets = [];
  let score = 0, lives = 3, level = 0;
  let enemiesLeftInPool = 0;
  let enemySpawnPoints = [{ x: 0, y: 0 }, { x: CELL * 12, y: 0 }, { x: BOARD - TANK, y: 0 }];
  let enemySpawnTimer = 0;
  let state = 'menu'; // menu, playing, paused, gameover, win
  let respawnTimer = 0;

  function allTanks() { return [player, ...enemies].filter(Boolean); }

  function rectsOverlap(x1, y1, w1, h1, x2, y2, w2, h2) {
    return x1 < x2 + w2 && x1 + w1 > x2 && y1 < y2 + h2 && y1 + h1 > y2;
  }

  function explodeBase() {
    state = 'gameover';
    showOverlay('БАЗА УНИЧТОЖЕНА', 'Враги захватили вашу базу. Попробуйте снова.');
  }

  function hitTank(t) {
    t.hp -= 1;
    if (t.hp <= 0) {
      t.alive = false;
      spawnSpark(t.x + TANK / 2, t.y + TANK / 2);
      if (!t.isPlayer) {
        score += t.score;
        scoreVal.textContent = score;
      } else {
        onPlayerDeath();
      }
    }
  }

  function onPlayerDeath() {
    lives -= 1;
    livesVal.textContent = Math.max(lives, 0);
    if (lives < 0) {
      state = 'gameover';
      showOverlay('ИГРА ОКОНЧЕНА', `Финальный счёт: ${score}`);
      return;
    }
    respawnTimer = 60;
  }

  function respawnPlayer() {
    player = new Tank(CELL * 12, BOARD - TANK, 'up', true);
    player.invuln = 90;
  }

  function spawnEnemy() {
    if (enemies.filter(e => e.alive).length >= 4) return;
    if (enemiesLeftInPool <= 0) return;
    const sp = enemySpawnPoints[Math.floor(Math.random() * enemySpawnPoints.length)];
    if (!allTanks().every(t => !t.alive || !rectsOverlap(sp.x, sp.y, TANK, TANK, t.x, t.y, TANK, TANK))) return;
    const e = new Tank(sp.x, sp.y, 'down', false);
    const roll = Math.random();
    if (roll < 0.2) { e.type = 'fast'; e.speed = 2.6; e.color = '#4cc9f0'; e.score = 200; }
    else if (roll < 0.35) { e.type = 'armor'; e.hp = 3; e.color = '#adb5bd'; e.score = 300; }
    else { e.type = 'normal'; e.color = '#ef476f'; e.score = 100; }
    e.moveTimer = Math.random() * 30;
    enemies.push(e);
    enemiesLeftInPool -= 1;
  }

  function updateEnemyAI(e) {
    e.moveTimer -= 1;
    if (e.moveTimer <= 0 || Math.random() < 0.01) {
      const dirs = Object.keys(DIRS);
      e.dir = dirs[Math.floor(Math.random() * dirs.length)];
      e.moveTimer = 30 + Math.random() * 60;
    }
    const before = { x: e.x, y: e.y };
    e.move(e.dir);
    if (before.x === e.x && before.y === e.y) {
      e.moveTimer = 0;
    }
    if (Math.random() < 0.02) e.shoot();
    if (e.cooldown > 0) e.cooldown -= 1;
  }

  const keys = {};
  window.addEventListener('keydown', (ev) => {
    keys[ev.key.toLowerCase()] = true;
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(ev.key.toLowerCase())) ev.preventDefault();
    if (ev.key === 'Enter' && state === 'menu') startGame();
    if (ev.key.toLowerCase() === 'p') togglePause();
  });
  window.addEventListener('keyup', (ev) => { keys[ev.key.toLowerCase()] = false; });

  function handleInput() {
    if (!player || !player.alive) return;
    let moved = false;
    if (keys['arrowup'] || keys['w']) { player.move('up'); moved = true; }
    else if (keys['arrowdown'] || keys['s']) { player.move('down'); moved = true; }
    else if (keys['arrowleft'] || keys['a']) { player.move('left'); moved = true; }
    else if (keys['arrowright'] || keys['d']) { player.move('right'); moved = true; }
    if (keys[' '] || keys['enter']) player.shoot();
    if (player.cooldown > 0) player.cooldown -= 1;
    if (player.invuln > 0) player.invuln -= 1;
  }

  function showOverlay(title, text, showButton = true) {
    overlay.classList.remove('hidden');
    overlay.innerHTML = `<h1>${title}</h1><p>${text}</p>` + (showButton ? `<button id="startBtn2">Играть снова</button>` : '');
    if (showButton) document.getElementById('startBtn2').addEventListener('click', startGame);
  }

  function hideOverlay() { overlay.classList.add('hidden'); }

  function startGame() {
    score = 0; lives = 3; level = 0;
    scoreVal.textContent = score; livesVal.textContent = lives; levelVal.textContent = level + 1;
    startLevel(level);
    state = 'playing';
    hideOverlay();
  }

  function startLevel(idx) {
    buildLevel(idx);
    enemies = [];
    bullets = [];
    sparks = [];
    enemiesLeftInPool = 8 + idx * 4;
    enemiesVal.textContent = enemiesLeftInPool;
    respawnPlayer();
    enemySpawnTimer = 30;
  }

  function nextLevel() {
    level += 1;
    levelVal.textContent = level + 1;
    if (level >= LEVELS.length * 3) {
      state = 'win';
      showOverlay('ПОБЕДА!', `Вы прошли все уровни. Счёт: ${score}`);
      return;
    }
    startLevel(level);
  }

  function togglePause() {
    if (state === 'playing') { state = 'paused'; showOverlay('ПАУЗА', 'Нажмите продолжить, чтобы вернуться в игру.'); pauseBtn.textContent = 'Продолжить'; }
    else if (state === 'paused') { state = 'playing'; hideOverlay(); pauseBtn.textContent = 'Пауза'; }
  }

  startBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', startGame);

  function update() {
    if (state !== 'playing') return;

    if (respawnTimer > 0) {
      respawnTimer -= 1;
      if (respawnTimer === 0) respawnPlayer();
    }

    handleInput();

    for (const e of enemies) { if (e.alive) updateEnemyAI(e); }

    enemySpawnTimer -= 1;
    if (enemySpawnTimer <= 0) { spawnEnemy(); enemySpawnTimer = 90; }

    for (const b of bullets) if (b.alive) b.update();
    bullets = bullets.filter(b => b.alive);

    enemies = enemies.filter(e => e.alive || false);
    enemiesVal.textContent = enemiesLeftInPool + enemies.filter(e => e.alive).length;

    sparks.forEach(s => s.life -= 1);
    sparks = sparks.filter(s => s.life > 0);

    if (!base.alive) return;

    if (enemiesLeftInPool <= 0 && enemies.filter(e => e.alive).length === 0) {
      nextLevel();
    }
  }

  function drawCell(type, x, y) {
    if (type === BRICK) {
      ctx.fillStyle = '#b1440e';
      ctx.fillRect(x, y, CELL, CELL);
      ctx.strokeStyle = '#7a2c08';
      ctx.strokeRect(x + 0.5, y + 0.5, CELL - 1, CELL - 1);
    } else if (type === STEEL) {
      ctx.fillStyle = '#8d99ae';
      ctx.fillRect(x, y, CELL, CELL);
      ctx.strokeStyle = '#495057';
      ctx.strokeRect(x + 2, y + 2, CELL - 4, CELL - 4);
    } else if (type === WATER) {
      ctx.fillStyle = '#1d6fa5';
      ctx.fillRect(x, y, CELL, CELL);
    } else if (type === BASE) {
      ctx.fillStyle = base.alive ? '#ffd166' : '#333';
      ctx.fillRect(x, y, CELL, CELL);
    }
  }

  function drawGrass(type, x, y) {
    if (type === GRASS) {
      ctx.fillStyle = '#2b9348';
      ctx.fillRect(x, y, CELL, CELL);
      ctx.fillStyle = '#40b85c';
      ctx.fillRect(x + 3, y + 2, 4, 4);
      ctx.fillRect(x + 12, y + 8, 4, 4);
      ctx.fillRect(x + 6, y + 13, 4, 4);
    }
  }

  function drawTank(t) {
    if (!t.alive) return;
    if (t.invuln > 0 && Math.floor(t.invuln / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(t.x + TANK / 2, t.y + TANK / 2);
    const angle = { up: 0, right: Math.PI / 2, down: Math.PI, left: -Math.PI / 2 }[t.dir];
    ctx.rotate(angle);
    ctx.fillStyle = t.color;
    ctx.fillRect(-TANK / 2 + 4, -TANK / 2 + 2, TANK - 8, TANK - 4);
    ctx.fillStyle = '#111';
    ctx.fillRect(-TANK / 2 + 2, -TANK / 2 + 4, 6, TANK - 8);
    ctx.fillRect(TANK / 2 - 8, -TANK / 2 + 4, 6, TANK - 8);
    ctx.fillStyle = '#222';
    ctx.fillRect(-3, -TANK / 2 - 4, 6, TANK / 2 + 4);
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, BOARD, BOARD);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, BOARD, BOARD);

    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const t = grid[r][c];
        if (t !== EMPTY && t !== GRASS) drawCell(t, c * CELL, r * CELL);
      }
    }

    if (player) drawTank(player);
    for (const e of enemies) drawTank(e);

    ctx.fillStyle = '#ffe066';
    for (const b of bullets) ctx.fillRect(b.x, b.y, b.size, b.size);

    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (grid[r][c] === GRASS) drawGrass(GRASS, c * CELL, r * CELL);
      }
    }

    ctx.fillStyle = '#ffd166';
    for (const s of sparks) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, 10 - s.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  buildLevel(0);
  draw();
  loop();
})();
</script>
</body>
</html>
