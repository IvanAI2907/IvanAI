<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тетрис</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d29;
    --border: #2e3346;
    --accent: #7c5cff;
    --text: #e8e9f0;
    --muted: #8a8fa3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1c1f2e, #0b0c12);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    padding: 16px;
  }
  .app {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }
  .board-wrap {
    position: relative;
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  canvas#board {
    display: block;
    background: #0a0b10;
    border-radius: 6px;
  }
  .side {
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .panel {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stat {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    margin-bottom: 6px;
  }
  .stat b { color: var(--accent); }
  canvas#next {
    display: block;
    margin: 0 auto;
    background: #0a0b10;
    border-radius: 6px;
  }
  button {
    width: 100%;
    padding: 10px;
    margin-top: 4px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: 0.85; }
  .keys {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .keys b { color: var(--text); }
  .overlay {
    position: absolute;
    inset: 10px;
    background: rgba(10,11,16,0.88);
    border-radius: 6px;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    gap: 10px;
    z-index: 5;
  }
  .overlay.show { display: flex; }
  .overlay h1 {
    font-size: 24px;
    margin: 0;
  }
  .overlay p {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
  }
  h1.title {
    text-align: center;
    margin: 0 0 12px;
    font-size: 20px;
    letter-spacing: 2px;
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="app">
  <div>
    <h1 class="title">ТЕТРИС</h1>
    <div class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlayTitle">Пауза</h1>
        <p id="overlayText">Нажми «Продолжить»</p>
        <button id="overlayBtn">Продолжить</button>
      </div>
    </div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>Следующая</h2>
      <canvas id="next" width="120" height="120"></canvas>
    </div>
    <div class="panel">
      <h2>Статистика</h2>
      <div class="stat"><span>Очки</span><b id="score">0</b></div>
      <div class="stat"><span>Линии</span><b id="lines">0</b></div>
      <div class="stat"><span>Уровень</span><b id="level">1</b></div>
      <div class="stat"><span>Рекорд</span><b id="best">0</b></div>
    </div>
    <div class="panel">
      <button id="pauseBtn">Пауза</button>
      <button id="restartBtn">Заново</button>
    </div>
    <div class="panel keys">
      <div><b>← →</b> — движение</div>
      <div><b>↑</b> — поворот</div>
      <div><b>↓</b> — быстрое падение</div>
      <div><b>Space</b> — сброс</div>
      <div><b>P</b> — пауза</div>
    </div>
  </div>
</div>

<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 30;
  const boardCanvas = document.getElementById('board');
  const ctx = boardCanvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const overlayBtn = document.getElementById('overlayBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');

  const COLORS = {
    I: '#4dd8ff',
    O: '#ffe14d',
    T: '#c77dff',
    S: '#4dff8b',
    Z: '#ff5d5d',
    J: '#4d7fff',
    L: '#ff9f4d'
  };

  const SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };

  const KEYS = Object.keys(SHAPES);

  function rotatePoints(points, times) {
    let pts = points;
    for (let t = 0; t < times; t++) {
      pts = pts.map(([x,y]) => [y, -x]);
      const minX = Math.min(...pts.map(p=>p[0]));
      const minY = Math.min(...pts.map(p=>p[1]));
      pts = pts.map(([x,y]) => [x-minX, y-minY]);
    }
    return pts;
  }

  function randomPiece() {
    const key = KEYS[Math.floor(Math.random()*KEYS.length)];
    return { key, rotation: 0, x: 3, y: -1 };
  }

  function getCells(piece) {
    const base = rotatePoints(SHAPES[piece.key], piece.rotation % 4);
    return base.map(([x,y]) => [x + piece.x, y + piece.y]);
  }

  let grid, current, next, score, lines, level, dropInterval, dropTimer, running, gameOver, paused;
  let best = Number(localStorage.getItem('tetrisBest') || 0);
  bestEl.textContent = best;

  function emptyGrid() {
    return Array.from({length: ROWS}, () => Array(COLS).fill(null));
  }

  function resetGame() {
    grid = emptyGrid();
    current = randomPiece();
    next = randomPiece();
    score = 0;
    lines = 0;
    level = 1;
    dropInterval = 800;
    running = true;
    gameOver = false;
    paused = false;
    updateStats();
    hideOverlay();
    restartDropTimer();
  }

  function updateStats() {
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  }

  function collides(piece, cells) {
    for (const [x, y] of cells) {
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function merge(piece) {
    const cells = getCells(piece);
    for (const [x, y] of cells) {
      if (y >= 0) grid[y][x] = piece.key;
    }
  }

  function clearLines() {
    let cleared = 0;
    for (let y = ROWS - 1; y >= 0; y--) {
      if (grid[y].every(cell => cell)) {
        grid.splice(y, 1);
        grid.unshift(Array(COLS).fill(null));
        cleared++;
        y++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      const newLevel = Math.floor(lines / 10) + 1;
      if (newLevel !== level) {
        level = newLevel;
        dropInterval = Math.max(100, 800 - (level - 1) * 70);
        restartDropTimer();
      }
      updateStats();
    }
  }

  function spawnNext() {
    current = next;
    current.x = 3;
    current.y = -1;
    next = randomPiece();
    if (collides(current, getCells(current))) {
      endGame();
    }
  }

  function endGame() {
    running = false;
    gameOver = true;
    clearInterval(dropTimer);
    if (score > best) {
      best = score;
      localStorage.setItem('tetrisBest', best);
      bestEl.textContent = best;
    }
    overlayTitle.textContent = 'Игра окончена';
    overlayText.textContent = `Очки: ${score}`;
    overlayBtn.textContent = 'Заново';
    showOverlay();
  }

  function hardDrop() {
    if (!running || paused) return;
    while (!collides(current, getCells({...current, y: current.y + 1}))) {
      current.y++;
      score += 2;
    }
    lockPiece();
  }

  function lockPiece() {
    merge(current);
    clearLines();
    spawnNext();
    updateStats();
    draw();
  }

  function tick() {
    if (!running || paused) return;
    const moved = { ...current, y: current.y + 1 };
    if (!collides(moved, getCells(moved))) {
      current.y++;
    } else {
      lockPiece();
    }
    draw();
  }

  function restartDropTimer() {
    clearInterval(dropTimer);
    dropTimer = setInterval(tick, dropInterval);
  }

  function move(dx) {
    if (!running || paused) return;
    const moved = { ...current, x: current.x + dx };
    if (!collides(moved, getCells(moved))) {
      current.x += dx;
      draw();
    }
  }

  function rotate() {
    if (!running || paused) return;
    const rotated = { ...current, rotation: (current.rotation + 1) % 4 };
    const cells = rotatePoints(SHAPES[rotated.key], rotated.rotation);
    const testOffsets = [0, -1, 1, -2, 2];
    for (const dx of testOffsets) {
      const candidate = { ...rotated, x: rotated.x + dx };
      if (!collides(candidate, cells.map(([x,y]) => [x + candidate.x, y + candidate.y]))) {
        current = candidate;
        draw();
        return;
      }
    }
  }

  function softDrop() {
    if (!running || paused) return;
    const moved = { ...current, y: current.y + 1 };
    if (!collides(moved, getCells(moved))) {
      current.y++;
      score += 1;
      updateStats();
      draw();
    } else {
      lockPiece();
    }
  }

  function drawCell(c, x, y, color) {
    const px = x * CELL, py = y * CELL;
    c.fillStyle = color;
    c.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    c.strokeStyle = 'rgba(255,255,255,0.15)';
    c.strokeRect(px + 1, py + 1, CELL - 2, CELL - 2);
  }

  function draw() {
    ctx.clearRect(0, 0, boardCanvas.width, boardCanvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(x*CELL, 0);
      ctx.lineTo(x*CELL, ROWS*CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(0, y*CELL);
      ctx.lineTo(COLS*CELL, y*CELL);
      ctx.stroke();
    }

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (grid[y][x]) drawCell(ctx, x, y, COLORS[grid[y][x]]);
      }
    }

    if (running) {
      const ghost = { ...current };
      while (!collides({ ...ghost, y: ghost.y + 1 }, getCells({ ...ghost, y: ghost.y + 1 }))) {
        ghost.y++;
      }
      for (const [x, y] of getCells(ghost)) {
        if (y >= 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
        }
      }
      for (const [x, y] of getCells(current)) {
        if (y >= 0) drawCell(ctx, x, y, COLORS[current.key]);
      }
    }

    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    const cells = SHAPES[next.key];
    const cellSize = 24;
    const offsetX = (nextCanvas.width - 4*cellSize) / 2;
    const offsetY = (nextCanvas.height - 4*cellSize) / 2;
    for (const [x, y] of cells) {
      nctx.fillStyle = COLORS[next.key];
      nctx.fillRect(offsetX + x*cellSize + 1, offsetY + y*cellSize + 1, cellSize-2, cellSize-2);
    }
  }

  function showOverlay() { overlay.classList.add('show'); }
  function hideOverlay() { overlay.classList.remove('show'); }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = 'Пауза';
      overlayText.textContent = 'Нажми «Продолжить»';
      overlayBtn.textContent = 'Продолжить';
      showOverlay();
    } else {
      hideOverlay();
    }
  }

  overlayBtn.addEventListener('click', () => {
    if (gameOver) {
      resetGame();
      draw();
    } else {
      togglePause();
    }
  });

  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', () => { resetGame(); draw(); });

  document.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'ArrowLeft': e.preventDefault(); move(-1); break;
      case 'ArrowRight': e.preventDefault(); move(1); break;
      case 'ArrowDown': e.preventDefault(); softDrop(); break;
      case 'ArrowUp': e.preventDefault(); rotate(); break;
      case 'Space': e.preventDefault(); hardDrop(); break;
      case 'KeyP': e.preventDefault(); togglePause(); break;
    }
  });

  resetGame();
  draw();
})();
</script>
</body>
</html>
